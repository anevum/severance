name: Targeted Git history credential check (no deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest scripts/test_scan_git_history.py
      - run: python3 scripts/scan-git-history.py
# Verification only. No Godot export, deployment, external account access or runtime mutation.
